<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord OAuth Callback</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #FFD700; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f55; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner" id="spinner"></div>
    <p id="status">Signing in...</p>
    <p class="error" id="error" style="display:none"></p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        showError('No authorization code received.');
        return;
      }

      try {
        const res = await fetch(
          'https://us-central1-the-big-6ix.cloudfunctions.net/verifyDiscordRole?code=' + encodeURIComponent(code)
        );

        // Read as text first so we can handle non-JSON responses
        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (_) {
          const error = encodeURIComponent('Server error (HTTP ' + res.status + '). Please try again.');
          redirectToApp('false', '', '', error);
          return;
        }

        if (!data.success) {
          const error = encodeURIComponent(data.error || 'Sign-in failed. Please try again.');
          redirectToApp('false', '', '', error);
          return;
        }

        const token = encodeURIComponent(data.token);
        const name  = encodeURIComponent(data.name || '');
        redirectToApp('true', token, name, '');

      } catch (e) {
        const error = encodeURIComponent('Network error: ' + (e && e.message ? e.message : String(e)));
        redirectToApp('false', '', '', error);
      }
    })();

    function redirectToApp(success, token, name, error) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const base = 'auth/discord?success=' + success +
        (token ? '&token=' + token : '') +
        (name  ? '&name='  + name  : '') +
        (error ? '&error=' + error : '');
      if (isAndroid) {
        window.location.href =
          'intent://' + base + '#Intent;scheme=big6ix;package=com.invenium.thebig6ix;end';
      } else {
        window.location.href = 'big6ix://' + base;
      }
    }
  </script>
</body>
</html>
